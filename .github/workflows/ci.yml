name: CI

on:
  push:
  pull_request:

jobs:
  clean-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Build application image
        run: docker build --tag checkai-ci .

      - name: Initialize and verify a clean database
        run: docker run --rm --entrypoint sh checkai-ci -ec 'php bin/init-db.php && php tests/check-clean-db.php'
