<VirtualHost *:81>
    ServerName checkai.analitica-soft.ru
    ServerAdmin greg@analitica.ru

    DocumentRoot /var/www/checkai.analitica-soft.ru/public
    CustomLog /dev/null combined
    ErrorLog /var/logs-apache/checkai.analitica-soft.ru.error.log

    AddType application/x-httpd-php .php .php3 .php4 .php5 .phtml
    AddType application/x-httpd-php-source .phps

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    Alias /github-deploy-hook /usr/local/lib/checkai-webhook/github-webhook.php

    <Directory /var/www/checkai.analitica-soft.ru/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        <FilesMatch "^(?!(?:index|api)\\.php$).*\\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /usr/local/lib/checkai-webhook>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
</VirtualHost>
